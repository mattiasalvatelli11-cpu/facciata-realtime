<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Admin Panel</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
    #feed { max-width: 700px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid #007bff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .meta { font-size: 0.85em; color: #666; margin-bottom: 8px; }
    .content { font-weight: bold; color: #333; word-break: break-all; margin-bottom: 12px; }
    .actions { display: flex; gap: 10px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .approve { background: #28a745; color: white; }
    .reject  { background: #dc3545; color: white; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Pannello Admin - Richieste in Arrivo</h2>
  <div id="feed"></div>

  <script>
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'new_request') {
          const feed = document.getElementById("feed");
          const div = document.createElement("div");
          div.className = "msg";
          div.dataset.requestId = data.requestId;

          div.innerHTML = `
            <div class="meta">${data.user} • ${new Date(data.ts).toLocaleTimeString()}</div>
            <div class="content">${data.message}</div>
            <div class="actions">
              <button class="approve" onclick="sendAction('${data.requestId}', 'approve', this.parentElement.parentElement)">✅ Approva</button>
              <button class="reject" onclick="sendAction('${data.requestId}', 'reject', this.parentElement.parentElement)">❌ Rifiuta</button>
            </div>
          `;
          feed.prepend(div);
        }
      } catch (e) { console.error(e); }
    };

    function sendAction(requestId, action, element) {
      ws.send(JSON.stringify({ type: action, requestId }));
      element.remove();
    }
  </script>
</body>
</html>
